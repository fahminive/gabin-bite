<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>GabinBite - Offline</title>
    <meta name="theme-color" content="#23150f">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <style>
        :root { color-scheme: light dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #23150f;
            color: #fff3e0;
            text-align: center;
        }
        .card {
            max-width: 340px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        img { width: 96px; height: 96px; border-radius: 24px; }
        h1 { font-size: 20px; margin: 0; }
        p { font-size: 14px; line-height: 1.6; margin: 0; opacity: .85; }
        button {
            margin-top: 8px;
            border: 0;
            border-radius: 999px;
            padding: 12px 32px;
            font-size: 14px;
            font-weight: 700;
            background: #fff3e0;
            color: #23150f;
            touch-action: manipulation;
        }
        button:active { transform: scale(.97); }
    </style>
</head>
<body>
    <div class="card">
        <img src="/icons/icon-192.png" alt="GabinBite" width="96" height="96">
        <h1>Kamu sedang offline</h1>
        <p>GabinBite butuh koneksi internet untuk mengambil data terbaru dari dapur. Periksa sinyalmu lalu coba lagi.</p>
        <button onclick="location.reload()">Coba Lagi</button>
    </div>
</body>
</html>
